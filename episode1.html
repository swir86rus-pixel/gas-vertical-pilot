 for(const [n,[cx,by]] of Object.entries(ITEMS)){const [w0,h0]=SIZES[n],sc=Math.min(150/w0,155/h0)*CK,w=w0*sc,h=h0*sc;

 else if(!f.dressed)await say('Мастер Петрович','Шкаф с СИЗ — у стены. Одевайся, время идёт.')}
async function dress(){

 await walkTo(CAB.x-150*SC);st.dir=1;st.busy=true;
 let stage=f.stage||0;const left=new Set(Object.keys(ITEMS).filter(n=>!(f.taken||[]).includes(n)));f.taken=f.taken||[];
 while(stage<ORDER.length){
  const opts=[...left];
  const i=await say('Шкаф СИЗ',`Надето: ${stage?ORDER.slice(0,stage).map(n=>ITEMS[n][2].toLowerCase()).join(', '):'пока ничего'}. Что взять?`,opts.map(n=>ITEMS[n][2]));
  const n=opts[i];
  if(WRONG[n]){mistake();await say('Мастер Петрович',WRONG[n]);continue}
  if(n!==ORDER[stage]){await say('Мастер Петрович','Погоди с этим. '+NEXT_HINT[stage]);continue}
  $('it-'+n).style.opacity=0;left.delete(n);f.taken.push(n);stage++;f.stage=stage;
  await wait(300);st.pose={spr:'st'+(stage+1)};await wait(400)}
 f.dressed=1;st.busy=false;
 await seq([['Мастер Петрович','Вот теперь готов. Пойдём, покажу хозяйство — сначала экскурсия, потом работа.']]);

 requestAnimationFrame(()=>o.style.opacity=1);await wait(1100);location.href='episode1-2.html'}
